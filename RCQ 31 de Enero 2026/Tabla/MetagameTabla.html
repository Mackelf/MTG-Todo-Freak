<!DOCTYPE html>
<html>
  <head>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <title>Metagame Casa de juegos. 29 nov 25</title>
    <style>
      body {
        width: 80%;
        margin-left: auto;
        margin-right: auto;
      }

        /* Centrar texto de los encabezados */
  #metagame-table table thead th {
    text-align: center;
    vertical-align: middle;
  }

  /* Centrar también las celdas de números */
  #metagame-table table tbody td:nth-child(2),
  #metagame-table table tbody td:nth-child(3) {
    text-align: center;
    vertical-align: middle;
  }
    </style>
  </head>

  <body>
    <div class="row">
      <div class="col-12">
        <h1>Standard Metagame en Todo Freak. RCQ</h1>
        <h2>31 Enero 2026</h2>
      </div>
    </div>

    <div id="metagame-table"></div>

    <script>
      const metagameRows = [
        ["DISTRIBUCIÓN DEL METAGAME", "", "", ""],
        ["", "", "", ""],
        ["Arquetipo", "Cantidad", "% del Field", "Cartas Clave"],
        ["Jeskai Control", "2", "14.3%", "JeskaiControl.png"],
        ["Simic Rhythm", "1", "7.1%", "SimicRhythm.png"],
        ["5c Rhythm", "1", "7.1%", "SimicRhythm.png"],
        ["Azorius Control", "1", "7.1%", "AzoriusControl.png"],
        ["Mono Green Landfall", "1", "7.1%", "MonoGreenLandfall.png"],
        ["Boros Dragons", "1", "7.1%", "BorosDragons.png"],
        ["Izzet Lessons", "1", "7.1%", "IzzetLessons.png"],
        ["Dimir Leviathan", "1", "7.1%", "DimirLeviathan.png"],
        ["Jeskai Artifact", "1", "7.1%", "JeskaiArtifact.png"],
        ["Gruul Delirium", "1", "7.1%", "GruulDelirium.png"],
        ["Mono Red Leyline", "1", "7.1%", "MonoRedLeyline.png"],
        ["Simic Ouroboroid", "1", "7.1%", "SimicOuroboroid.png"],
        ["Mono Red Aggro", "1", "7.1%", "MonoRed.png"],
        ["", "", "", ""],
        ["RESUMEN", "", "", ""],
        ["Total de arquetipos diferentes", "12", "", ""],
        ["Metagame diversificado", "Sí", "78.6% single copy", ""],
        ["Control dominante", "14.3%", "2 Jeskai Control", ""],
      ];

      function buildMetagameTable(rows) {
        const container = document.getElementById("metagame-table");
        container.innerHTML = "";

        // Primera fila como título
        const titleRow = rows[0];
        const h2 = document.createElement("h2");
        h2.textContent = titleRow[0];
        container.appendChild(h2);

        // Buscar la fila de cabecera (la que diga "Arquetipo")
        const headerIndex = rows.findIndex((r) => r[0] === "Arquetipo");
        if (headerIndex === -1) return;

        const table = document.createElement("table");
        table.className = "table table-striped table-dark w-auto";

        // Cabecera
        const thead = document.createElement("thead");
        const headTr = document.createElement("tr");
        rows[headerIndex].forEach((text) => {
          const th = document.createElement("th");
          th.textContent = text;
          th.style.padding = "4px 8px";
          headTr.appendChild(th);
        });
        thead.appendChild(headTr);
        table.appendChild(thead);

        // Body
        const tbody = document.createElement("tbody");
        for (let i = headerIndex + 1; i < rows.length; i++) {
          const row = rows[i];
          // cortar cuando lleguemos a una fila completamente vacía o a "RESUMEN"
          if (!row[0] || row[0] === "RESUMEN") break;

          const tr = document.createElement("tr");

          row.forEach((cellValue, colIndex) => {
            const td = document.createElement("td");
            td.style.padding = "4px 8px";

            const isLastColumn = colIndex === row.length - 1;

            if (isLastColumn && cellValue) {
              const img = document.createElement("img");
              img.src = `./assets/${cellValue}`;
              img.alt = cellValue;
              img.style.maxWidth = "350px";
              img.style.width = "100%";
              img.style.height = "auto";
              td.style.textAlign = "center";
              td.appendChild(img);
            } else {
              td.textContent = cellValue;
            }

            tr.appendChild(td);
          });

          tbody.appendChild(tr);
        }

        table.appendChild(tbody);
        container.appendChild(table);

        // Bloque de resumen (opcional)
        const resumenIndex = rows.findIndex((r) => r[0] === "RESUMEN");
        if (resumenIndex !== -1) {
          const resumenTitle = document.createElement("h3");
          resumenTitle.textContent = "Resumen";
          container.appendChild(resumenTitle);

          const ul = document.createElement("ul");
          for (let i = resumenIndex + 1; i < rows.length; i++) {
            const r = rows[i];
            if (!r[0]) continue;
            const li = document.createElement("li");
            li.textContent = r.filter(Boolean).join(" – ");
            ul.appendChild(li);
          }
          container.appendChild(ul);
        }
      }

      buildMetagameTable(metagameRows);
    </script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
