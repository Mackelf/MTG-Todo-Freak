];


    function buildSimpleTable(containerId, rows, titleText) {
  const container = document.getElementById(containerId);
  container.innerHTML = "";

  const h2 = document.createElement("h2");
  h2.textContent = titleText;
  container.appendChild(h2);

  if (!rows || rows.length === 0) return;

  const table = document.createElement("table");
  table.className = "table table-striped table-dark w-auto";

  // Cabecera (primera fila)
  const thead = document.createElement("thead");
  const headTr = document.createElement("tr");
  rows[0].forEach((text) => {
    const th = document.createElement("th");
    th.textContent = text;
    th.style.padding = "4px 8px";
    th.style.textAlign = "center";
    headTr.appendChild(th);
  });
  thead.appendChild(headTr);
  table.appendChild(thead);

  // Body
  const tbody = document.createElement("tbody");
  for (let i = 1; i < rows.length; i++) {
    const row = rows[i];
    const tr = document.createElement("tr");
    row.forEach((cellValue, colIndex) => {
      const td = document.createElement("td");
      td.style.padding = "4px 8px";
      // Centramos todas las columnas numéricas
      if (colIndex === 0 || colIndex >= 3) {
        td.style.textAlign = "center";
      }
      td.textContent = cellValue;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  }

  table.appendChild(tbody);
  container.appendChild(table);
}


      
      buildSimpleTable("record-jugadores-table", recordJugadoresRows, "Record de Jugadores");

    </script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"

    ></script>
