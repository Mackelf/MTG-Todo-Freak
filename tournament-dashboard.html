<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Torneo Magic</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .filter-section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .filter-section label {
            margin-right: 10px;
            font-weight: bold;
        }
        
        .filter-section select {
            padding: 8px 15px;
            border-radius: 5px;
            border: 2px solid #667eea;
            font-size: 14px;
            cursor: pointer;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-card h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 14px;
            text-transform: uppercase;
        }
        
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #333;
        }
        
        .stat-label {
            color: #666;
            font-size: 0.9em;
            margin-top: 5px;
        }
        
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .chart-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .chart-container h3 {
            color: #667eea;
            margin-bottom: 15px;
            text-align: center;
        }
        
        table {
            width: 100%;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        th {
            background: #667eea;
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: bold;
        }
        
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
        }
        
        tr:hover {
            background: #f5f5f5;
        }
        
        .medal {
            display: inline-block;
            width: 25px;
            height: 25px;
            line-height: 25px;
            text-align: center;
            border-radius: 50%;
            font-weight: bold;
            margin-right: 5px;
        }
        
        .gold { background: #FFD700; color: #333; }
        .silver { background: #C0C0C0; color: #333; }
        .bronze { background: #CD7F32; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏆 Dashboard Torneo Magic - Standard</h1>
        
        <div class="filter-section">
            <label for="monthFilter">Filtrar por mes:</label>
            <select id="monthFilter" onchange="updateDashboard()">
                <option value="all">Todos los meses</option>
                <option value="noviembre">Noviembre</option>
                <option value="diciembre">Diciembre</option>
                <option value="enero">Enero</option>
            </select>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <h3>🥇 Mejor Jugador</h3>
                <div class="stat-value" id="topPlayer">-</div>
                <div class="stat-label" id="topPlayerStats">-</div>
            </div>
            
            <div class="stat-card">
                <h3>🎯 Mejor Mazo</h3>
                <div class="stat-value" id="topDeck">-</div>
                <div class="stat-label" id="topDeckStats">-</div>
            </div>
        </div>
        
        <div class="charts-grid">
            <div class="chart-container">
                <h3>Top 10 Jugadores por Puntos</h3>
                <canvas id="playersChart"></canvas>
            </div>
            
            <div class="chart-container">
                <h3>Rendimiento de Mazos (%V)</h3>
                <canvas id="decksChart"></canvas>
            </div>
        </div>
        
        <div class="chart-container" style="margin-bottom: 30px;">
            <h3>Ranking General de Jugadores</h3>
            <div id="playerRanking"></div>
        </div>
        
        <div class="chart-container">
            <h3>Análisis Detallado de Mazos</h3>
            <div id="deckAnalysis"></div>
        </div>
    </div>

        let playersChart, decksChart;
        
        function filterData(month) {
            if (month === 'all') return tournamentData;
            return tournamentData.filter(d => d.mes === month);
        }
        
        function aggregatePlayerStats(data) {
            const playerStats = {};
            
            data.forEach(row => {
                if (!playerStats[row.nombre]) {
                    playerStats[row.nombre] = {
                        nombre: row.nombre,
                        puntos: 0,
                        victorias: 0,
                        derrotas: 0,
                        empates: 0,
                        partidas: 0
                    };
                }
                
                playerStats[row.nombre].puntos += row.puntos;
                playerStats[row.nombre].victorias += row.victorias;
                playerStats[row.nombre].derrotas += row.derrotas;
                playerStats[row.nombre].empates += row.empates;
                playerStats[row.nombre].partidas += row.victorias + row.derrotas + row.empates;
            });
            
            return Object.values(playerStats).sort((a, b) => b.puntos - a.puntos);
        }
        
        function aggregateDeckStats(data) {
            const deckStats = {};
            
            data.forEach(row => {
                if (!deckStats[row.arquetipo]) {
                    deckStats[row.arquetipo] = {
                        arquetipo: row.arquetipo,
                        victorias: 0,
                        derrotas: 0,
                        empates: 0,
                        puntos: 0,
                        apariciones: 0
                    };
                }
                
                deckStats[row.arquetipo].victorias += row.victorias;
                deckStats[row.arquetipo].derrotas += row.derrotas;
                deckStats[row.arquetipo].empates += row.empates;
                deckStats[row.arquetipo].puntos += row.puntos;
                deckStats[row.arquetipo].apariciones += 1;
            });
            
            Object.values(deckStats).forEach(deck => {
                const totalGames = deck.victorias + deck.derrotas + deck.empates;
                deck.winRate = totalGames > 0 ? (deck.victorias / totalGames * 100).toFixed(1) : 0;
            });
            
            return Object.values(deckStats).sort((a, b) => parseFloat(b.winRate) - parseFloat(a.winRate));
        }
        
        function updateDashboard() {
            const selectedMonth = document.getElementById('monthFilter').value;
            const filteredData = filterData(selectedMonth);
            
            const playerStats = aggregatePlayerStats(filteredData);
            const deckStats = aggregateDeckStats(filteredData);
            
            // Actualizar cards de estadísticas
            const topPlayer = playerStats[0];
            document.getElementById('topPlayer').textContent = topPlayer.nombre;
            document.getElementById('topPlayerStats').textContent = 
                `${topPlayer.puntos} pts | ${topPlayer.victorias}-${topPlayer.derrotas}-${topPlayer.empates}`;
            
            const topDeck = deckStats[0];
            document.getElementById('topDeck').textContent = topDeck.arquetipo;
            document.getElementById('topDeckStats').textContent = 
                `${topDeck.winRate}% WR | ${topDeck.victorias}-${topDeck.derrotas}`;
            
            // Actualizar gráficos
            updatePlayersChart(playerStats.slice(0, 10));
            updateDecksChart(deckStats);
            
            // Actualizar tablas
            updatePlayerRanking(playerStats);
            updateDeckAnalysis(deckStats);
        }
        
        function updatePlayersChart(players) {
            const ctx = document.getElementById('playersChart').getContext('2d');
            
            if (playersChart) playersChart.destroy();
            
            playersChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: players.map(p => p.nombre),
                    datasets: [{
                        label: 'Puntos',
                        data: players.map(p => p.puntos),
                        backgroundColor: 'rgba(102, 126, 234, 0.8)',
                        borderColor: 'rgba(102, 126, 234, 1)',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        }
        
        function updateDecksChart(decks) {
            const ctx = document.getElementById('decksChart').getContext('2d');
            
            if (decksChart) decksChart.destroy();
            
            const colors = [
                'rgba(255, 99, 132, 0.8)',
                'rgba(54, 162, 235, 0.8)',
                'rgba(255, 206, 86, 0.8)',
                'rgba(75, 192, 192, 0.8)',
                'rgba(153, 102, 255, 0.8)',
                'rgba(255, 159, 64, 0.8)',
                'rgba(199, 199, 199, 0.8)',
                'rgba(83, 102, 255, 0.8)'
            ];
            
            decksChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: decks.map(d => d.arquetipo),
                    datasets: [{
                        data: decks.map(d => parseFloat(d.winRate)),
                        backgroundColor: colors,
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { 
                            position: 'right',
                            labels: { boxWidth: 15, font: { size: 11 } }
                        }
                    }
                }
            });
        }
        
        function updatePlayerRanking(players) {
            let html = '<table><thead><tr><th>Posición</th><th>Jugador</th><th>Puntos</th><th>V-D-E</th><th>%V</th></tr></thead><tbody>';
            
            players.forEach((player, index) => {
                const winRate = player.partidas > 0 ? 
                    (player.victorias / player.partidas * 100).toFixed(1) : 0;
                
                let medal = '';
                if (index === 0) medal = '<span class="medal gold">🥇</span>';
                else if (index === 1) medal = '<span class="medal silver">🥈</span>';
                else if (index === 2) medal = '<span class="medal bronze">🥉</span>';
                
                html += `<tr>
                    <td>${medal}${index + 1}</td>
                    <td>${player.nombre}</td>
                    <td><strong>${player.puntos}</strong></td>
                    <td>${player.victorias}-${player.derrotas}-${player.empates}</td>
                    <td>${winRate}%</td>
                </tr>`;
            });
            
            html += '</tbody></table>';
            document.getElementById('playerRanking').innerHTML = html;
        }
        
        function updateDeckAnalysis(decks) {
            let html = '<table><thead><tr><th>Mazo</th><th>Apariciones</th><th>V-D-E</th><th>%V</th><th>Puntos</th></tr></thead><tbody>';
            
            decks.forEach(deck => {
                html += `<tr>
                    <td><strong>${deck.arquetipo}</strong></td>
                    <td>${deck.apariciones}</td>
                    <td>${deck.victorias}-${deck.derrotas}-${deck.empates}</td>
                    <td><strong>${deck.winRate}%</strong></td>
                    <td>${deck.puntos}</td>
                </tr>`;
            });
            
            html += '</tbody></table>';
            document.getElementById('deckAnalysis').innerHTML = html;
        }
        
        // Inicializar dashboard
        updateDashboard();
    </script>
