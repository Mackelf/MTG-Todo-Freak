<script>
  // ─────────────────────────────────────────────────────────
  // CONFIGURACIÓN: agrega aquí cada semana cuando la tengas
  // El nombre del archivo debe estar en data/ con ese nombre.
  // ─────────────────────────────────────────────────────────
  const WEEKS = [
    { label: "Week 2", file: "data/S3_W2.json" },
    { label: "Week 3", file: "data/S3_W3.json" },
    { label: "Week 4", file: "data/S3_W4.json" },
    { label: "Week 5", file: "data/S3_W5.json" },
    // Agrega más semanas aquí:
    // { label: 'Week 6',  file: 'data/S3_W6.json' },
  ];

  // ─────────────────────────────────────────────────────────

  let allData = [];
  let weekData = {};
  let currentView = "acum";
  let availableWeeks = [];

  const loadingScreen = document.getElementById("loadingScreen");
  const errorScreen = document.getElementById("errorScreen");
  const dashboard = document.getElementById("dashboard");
  const dropdown = document.getElementById("weekDropdown");

  async function init() {
    const loaded = [];
    allData = [];
    weekData = {};
    availableWeeks = [];
    dropdown.innerHTML = "";

    for (const w of WEEKS) {
      try {
        const res = await fetch(w.file);
        if (!res.ok) break;
        const json = await res.json();
        if (!Array.isArray(json) || !json[0]?.Nombre) break;
        loaded.push({ ...w, data: json });
      } catch {
        break;
      }
    }

    if (loaded.length === 0) {
      loadingScreen.style.display = "none";
      errorScreen.classList.add("visible");
      return;
    }

    availableWeeks = loaded;

    loaded.forEach((w, i) => {
      const opt = document.createElement("option");
      opt.value = i;
      opt.textContent = w.label;
      if (i === loaded.length - 1) opt.selected = true;
      dropdown.appendChild(opt);
    });

    allData = loaded.flatMap((w) => w.data);
    loaded.forEach((w) => {
      weekData[w.label] = w.data;
    });

    dropdown.addEventListener("change", renderWeekView);

    loadingScreen.style.display = "none";
    dashboard.classList.add("visible");
    renderAcumView();
    renderWeekView();
  }

  function setView(v) {
    currentView = v;
    document.getElementById("viewAcum").style.display =
      v === "acum" ? "" : "none";
    document.getElementById("viewWeek").style.display =
      v === "week" ? "" : "none";
    document.getElementById("tabAcum").classList.toggle("active", v === "acum");
    document.getElementById("tabWeek").classList.toggle("active", v === "week");
  }

  function getTournamentGroupsFromAllData(raw) {
    const groups = {};

    raw.forEach((r) => {
      const dateKey = (r.Fecha || "").slice(0, 10);
      if (!groups[dateKey]) groups[dateKey] = [];
      groups[dateKey].push(r);
    });

    return Object.entries(groups)
      .sort((a, b) => a[0].localeCompare(b[0]))
      .map(([date, entries], idx) => ({
        key: date,
        label: `Torneo ${idx + 1}`,
        entries: entries.sort((a, b) => a.Puesto - b.Puesto),
      }));
  }

  // ── VISTA: ESTA SEMANA ──────────────────────────────────
  function renderWeekView() {
    const idx = parseInt(dropdown.value, 10);
    const w = availableWeeks[idx];
    if (!w) return;

    const data = w.data;

    document.getElementById("weekViewTag").textContent = w.label.toUpperCase();

    const statsRow = document.getElementById("statsRow");
    statsRow.innerHTML = "";

    const sorted = [...data].sort((a, b) => a.Puesto - b.Puesto);
    const winner = sorted[0];
    const jgAvg =
      data.reduce((s, e) => s + parseFloat(e["%JG"] || 0), 0) / data.length;

    const byArchW = {};
    data.forEach((r) => {
      const a = r.Arquetipo;
      if (!byArchW[a]) byArchW[a] = { name: a, count: 0 };
      byArchW[a].count++;
    });

    statsRow.innerHTML = `
      <div class="stat-card alt">
        <div class="stat-label">Jugadores</div>
        <div class="stat-value">${data.length}</div>
        <div class="stat-sub">${w.label}</div>
      </div>
      <div class="stat-card green-top">
        <div class="stat-label">Arquetipos</div>
        <div class="stat-value">${Object.keys(byArchW).length}</div>
        <div class="stat-sub">Esta semana</div>
      </div>
      <div class="stat-card red-top">
        <div class="stat-label">Ganador</div>
        <div class="stat-value">${winner.Nombre.split(" ").slice(0, 2).join(" ")}</div>
        <div class="stat-sub">${winner.Arquetipo} · ${winner.Puntos} pts</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">WR Promedio</div>
        <div class="stat-value">${jgAvg.toFixed(0)}%</div>
        <div class="stat-sub">Win rate del torneo</div>
      </div>
    `;

    const podiumContainer = document.getElementById("weekDetailPodium");
    podiumContainer.innerHTML = "";

    const card = document.createElement("div");
    card.className = "week-card";

    const podiumRows = sorted
      .map((e, pi) => {
        const shortName = e.Nombre.replace(/\s\(.*\)/, "")
          .replace(" 🐸", "")
          .split(" ")
          .slice(0, 2)
          .join(" ");

        return `
          <div class="podium-row">
            <div class="podium-pos ${pi === 0 ? "gold" : ""}">#${e.Puesto}</div>
            <div>
              <div class="podium-name">${shortName}</div>
              <div class="podium-deck">${e.Arquetipo}</div>
            </div>
            <div class="podium-pts">${e.Puntos}</div>
          </div>
        `;
      })
      .join("");

    card.innerHTML = `<div class="week-podium">${podiumRows}</div>`;
    podiumContainer.appendChild(card);

    const archColors = [
      "#e8ff47",
      "#7b61ff",
      "#ff4757",
      "#3ddc84",
      "#ffb830",
      "#38b2ff",
      "#ff6b9d",
      "#a78bfa",
      "#ff9f43",
      "#00d2d3",
    ];

    const byArchFull = {};
    data.forEach((r) => {
      const a = r.Arquetipo;
      if (!byArchFull[a]) {
        byArchFull[a] = { name: a, count: 0, wins: 0, games: 0 };
      }
      byArchFull[a].count++;
      byArchFull[a].wins += parseInt(r.V || 0, 10);
      byArchFull[a].games +=
        parseInt(r.V || 0, 10) +
        parseInt(r.D || 0, 10) +
        parseInt(r.E || 0, 10);
    });

    const archs = Object.values(byArchFull).sort((a, b) => b.count - a.count);
    const weekArchGrid = document.getElementById("weekArchGrid");
    weekArchGrid.innerHTML = "";

    archs.forEach((a, i) => {
      const wr = a.games > 0 ? Math.round((a.wins / a.games) * 100) : 0;
      const wrColor =
        wr >= 55 ? "var(--win)" : wr >= 45 ? "var(--yellow)" : "var(--loss)";

      const row = document.createElement("div");
      row.className = "arch-row";
      row.innerHTML = `
        <div class="arch-color-dot" style="background:${archColors[i % archColors.length]}"></div>
        <div class="arch-name">${a.name}</div>
        <div class="arch-bar-wrap">
          <div class="wr-bar-bg" style="width:60px">
            <div class="wr-bar-fill" style="width:${wr}%;background:${archColors[i % archColors.length]}"></div>
          </div>
        </div>
        <div class="arch-wr" style="color:${wrColor}">${wr}%</div>
        <div class="arch-count">${a.count}× jugado</div>
      `;
      weekArchGrid.appendChild(row);
    });
  }

  // ── VISTA: ACUMULADO ─────────────────────────────────────
  function renderAcumView() {
    const raw = allData;
    if (!raw.length) return;

    const byPlayer = {};
    raw.forEach((r) => {
      const n = r.Nombre;
      if (!byPlayer[n]) {
        byPlayer[n] = {
          name: n,
          entries: [],
          totalPts: 0,
          totalW: 0,
          totalD: 0,
          totalL: 0,
          bestPos: 99,
          decks: [],
        };
      }

      byPlayer[n].entries.push(r);
      byPlayer[n].totalPts += Number(r.Puntos || 0);
      byPlayer[n].totalW += parseInt(r.V || 0, 10);
      byPlayer[n].totalD += parseInt(r.E || 0, 10);
      byPlayer[n].totalL += parseInt(r.D || 0, 10);
      if (r.Puesto < byPlayer[n].bestPos) byPlayer[n].bestPos = r.Puesto;
      byPlayer[n].decks.push(r.Arquetipo);
    });

    const players = Object.values(byPlayer).sort(
      (a, b) => b.totalPts - a.totalPts,
    );

    const weekKeys = availableWeeks.map((w) => w.label);
    const numWeeks = availableWeeks.length;

    const tournamentGroups = getTournamentGroupsFromAllData(raw);

    const byArch = {};
    raw.forEach((r) => {
      const a = r.Arquetipo;
      if (!byArch[a]) byArch[a] = { name: a, count: 0, wins: 0, games: 0 };
      byArch[a].count++;
      byArch[a].wins += parseInt(r.V || 0, 10);
      byArch[a].games +=
        parseInt(r.V || 0, 10) +
        parseInt(r.D || 0, 10) +
        parseInt(r.E || 0, 10);
    });

    const archs = Object.values(byArch).sort((a, b) => b.count - a.count);

    const consistentPlayers = players.filter((p) => p.entries.length >= 2);
    let mostConsistent = null;
    let bestAvg = 99;

    consistentPlayers.forEach((p) => {
      const avg =
        p.entries.reduce((s, e) => s + e.Puesto, 0) / p.entries.length;
      if (avg < bestAvg) {
        bestAvg = avg;
        mostConsistent = p;
      }
    });

    const uniquePlayers = Object.keys(byPlayer).length;

    let destacado = null;
    let destacadoCount = 0;
    players.forEach((p) => {
      const top3 = p.entries.filter((e) => e.Puesto <= 3).length;
      if (top3 > destacadoCount) {
        destacadoCount = top3;
        destacado = p;
      }
    });

    const lastLoadedWeek = availableWeeks[availableWeeks.length - 1];
    const lastWeekData = lastLoadedWeek?.data || [];
    const lastWeekDate = lastWeekData[0]?.Fecha
      ? new Date(lastWeekData[0].Fecha)
      : null;

    const lastDateStr = lastWeekDate
      ? lastWeekDate
          .toLocaleDateString("es-CL", {
            day: "2-digit",
            month: "short",
            year: "numeric",
          })
          .toUpperCase()
      : "—";

    document.getElementById("headerMeta").innerHTML = `
      <div>Semanas <span>${weekKeys.join(" + ")}</span></div>
      <div>Torneos <span>${numWeeks}</span></div>
      <div>Última fecha <span>${lastDateStr}</span></div>
      <div>Jugadores únicos <span>${uniquePlayers}</span></div>
    `;

    document.getElementById("cumulTag").textContent = weekKeys.join(" + ");

    const maxPts = players[0]?.totalPts || 1;
    const cumulContainer = document.getElementById("cumulBars");
    cumulContainer.innerHTML = "";

    players.forEach((p, i) => {
      const pct = (p.totalPts / maxPts) * 100;
      const shortName = p.name.replace(/\s\(.*\)/, "").replace(" 🐸", "");
      const torneos = p.entries.length;

      const row = document.createElement("div");
      row.className = "cumul-row";
      row.innerHTML = `
        <div class="cumul-bar-track" data-pct="${pct}"></div>
        <div class="cumul-pos">${i + 1}</div>
        <div class="cumul-name-block">
          <div class="cumul-name-main">${shortName}</div>
          <div class="cumul-name-sub">${torneos} torneo${torneos > 1 ? "s" : ""}</div>
        </div>
        <div class="cumul-pts-block">
          <div class="cumul-pts-num">${p.totalPts}</div>
          <div class="cumul-pts-label">pts</div>
        </div>
      `;
      cumulContainer.appendChild(row);
    });

    setTimeout(() => {
      document.querySelectorAll(".cumul-bar-track").forEach((el) => {
        el.style.width = el.dataset.pct + "%";
      });
    }, 100);

    const tbody = document.getElementById("playerTableBody");
    tbody.innerHTML = "";

    players.forEach((p, i) => {
      const att = p.entries.length;
      const jg =
        p.entries.reduce((s, e) => s + parseFloat(e["%JG"] || 0), 0) / att;
      const shortName = p.name.replace(" 🐸", "");
      const deckStr = [...new Set(p.decks)].join(", ");

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>
          <div class="player-name">
            <span class="rank-num ${i < 3 ? "top" : ""}">${i + 1}</span>
            ${shortName}
          </div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px;padding-left:28px;font-style:italic">${deckStr}</div>
        </td>
        <td><span class="attendance-badge ${att < 2 ? "one" : ""}">${att >= 2 ? "✦ " + att + " torneos" : "1 torneo"}</span></td>
        <td><span class="pts-badge">${p.totalPts}</span></td>
        <td>
          <div class="wde-bar">
            ${Array(p.totalW).fill('<span class="dot w"></span>').join("")}
            ${Array(p.totalD).fill('<span class="dot d"></span>').join("")}
            ${Array(p.totalL).fill('<span class="dot l"></span>').join("")}
            <span class="wde-text">${p.totalW}W · ${p.totalD}E · ${p.totalL}L</span>
          </div>
        </td>
        <td>
          <div class="wr-bar-wrap">
            <div class="wr-bar-bg"><div class="wr-bar-fill" style="width:${jg}%"></div></div>
            <span class="wr-pct">${jg.toFixed(1)}%</span>
          </div>
        </td>
        <td style="font-family:'Barlow Condensed',sans-serif;font-size:14px;color:${p.bestPos <= 3 ? "var(--yellow)" : "var(--muted)"}">#${p.bestPos}</td>
      `;
      tbody.appendChild(tr);
    });

    const finalPlayers = players
      .map((p) => {
        const att = p.entries.length;
        const bonus = Math.floor(att / 4);
        const finalPts = p.totalPts + att + bonus;
        return { ...p, att, bonus, finalPts };
      })
      .sort((a, b) => b.finalPts - a.finalPts);

    const finalBody = document.getElementById("finalRankBody");
    finalBody.innerHTML = "";

    finalPlayers.forEach((p, i) => {
      const shortName = p.name.replace(" 🐸", "");
      const isLeader = i === 0;
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>
          <div class="player-name">
            <span class="rank-num ${i < 3 ? "top" : ""}">${i + 1}</span>
            ${shortName}
          </div>
        </td>
        <td><span class="pts-badge">${p.totalPts}</span></td>
        <td><span class="attendance-badge ${p.att < 2 ? "one" : ""}">✦ ${p.att} torneo${p.att !== 1 ? "s" : ""}</span></td>
        <td>
          <span class="bonus-badge ${p.bonus === 0 ? "zero" : ""}">+${p.bonus} bonus</span>
          <div class="final-breakdown">${p.att} ÷ 4 = ${p.bonus} extra</div>
        </td>
        <td>
          <span class="final-pts-badge ${isLeader ? "leader" : ""}">${p.finalPts}</span>
          <div class="final-breakdown">${p.totalPts} + ${p.att} + ${p.bonus}</div>
        </td>
      `;
      finalBody.appendChild(tr);
    });

    const archColors = [
      "#e8ff47",
      "#7b61ff",
      "#ff4757",
      "#3ddc84",
      "#ffb830",
      "#38b2ff",
      "#ff6b9d",
      "#a78bfa",
      "#ff9f43",
      "#00d2d3",
    ];

    const archGrid = document.getElementById("archetypeGrid");
    archGrid.innerHTML = "";

    archs.forEach((a, i) => {
      const wr = a.games > 0 ? Math.round((a.wins / a.games) * 100) : 0;
      const wrColor =
        wr >= 55 ? "var(--win)" : wr >= 45 ? "var(--yellow)" : "var(--loss)";

      const row = document.createElement("div");
      row.className = "arch-row";
      row.innerHTML = `
        <div class="arch-color-dot" style="background:${archColors[i % archColors.length]}"></div>
        <div class="arch-name">${a.name}</div>
        <div class="arch-bar-wrap">
          <div class="wr-bar-bg" style="width:60px">
            <div class="wr-bar-fill" style="width:${wr}%;background:${archColors[i % archColors.length]}"></div>
          </div>
        </div>
        <div class="arch-wr" style="color:${wrColor}">${wr}%</div>
        <div class="arch-count">${a.count}× jugado</div>
      `;
      archGrid.appendChild(row);
    });

    const weekGrid = document.getElementById("weekGrid");
    weekGrid.innerHTML = "";

    tournamentGroups.forEach((group, wi) => {
      const entries = [...group.entries].sort((a, b) => a.Puesto - b.Puesto);
      const dateObj = new Date(group.key);
      const dateStr = dateObj.toLocaleDateString("es-CL", {
        day: "2-digit",
        month: "short",
        year: "numeric",
      });

      const card = document.createElement("div");
      card.className = "week-card";

      const top3 = entries.slice(0, 3);
      const rest = entries.slice(3);

      const podiumRows = top3
        .map((e, pi) => {
          const shortName = e.Nombre.replace(/\s\(.*\)/, "")
            .replace(" 🐸", "")
            .split(" ")
            .slice(0, 2)
            .join(" ");

          return `
            <div class="podium-row">
              <div class="podium-pos ${pi === 0 ? "gold" : ""}">#${e.Puesto}</div>
              <div>
                <div class="podium-name">${shortName}</div>
                <div class="podium-deck">${e.Arquetipo}</div>
              </div>
              <div class="podium-pts">${e.Puntos}</div>
            </div>
          `;
        })
        .join("");

      const restRows = rest
        .map((e) => {
          const shortName = e.Nombre.replace(/\s\(.*\)/, "")
            .replace(" 🐸", "")
            .split(" ")
            .slice(0, 2)
            .join(" ");

          return `
            <div class="podium-row">
              <div class="podium-pos">#${e.Puesto}</div>
              <div>
                <div class="podium-name">${shortName}</div>
                <div class="podium-deck">${e.Arquetipo}</div>
              </div>
              <div class="podium-pts">${e.Puntos}</div>
            </div>
          `;
        })
        .join("");

      const uid = `week-extra-${wi}`;

      card.innerHTML = `
        <div class="week-header">
          <div class="week-title">${group.label}</div>
          <div class="week-date">${dateStr} · ${entries.length} jugadores</div>
        </div>
        <div class="week-podium">
          ${podiumRows}
          ${
            rest.length > 0
              ? `
            <div id="${uid}" style="display:none">${restRows}</div>
            <button class="ver-mas-btn" onclick="
              const el=document.getElementById('${uid}');
              const open=el.style.display!=='none'&&el.style.display!=='';
              el.style.display=open?'none':'block';
              this.textContent=open?'▾ Ver más (${rest.length})':'▴ Ocultar';
            ">▾ Ver más (${rest.length})</button>
          `
              : ""
          }
        </div>
      `;

      weekGrid.appendChild(card);
    });

    const topArch = archs[0];
    const lastTournament = tournamentGroups[tournamentGroups.length - 1];
    const previousTournaments = tournamentGroups.slice(0, -1);

    const newPlayers = lastTournament
      ? [...new Set(lastTournament.entries.map((r) => r.Nombre))].filter((n) => {
          return !previousTournaments.some((tg) =>
            tg.entries.some((r) => r.Nombre === n),
          );
        })
      : [];

    const facts = [
      {
        icon: "🎯",
        title: "Arquetipo más popular",
        value: topArch ? topArch.name.split(" ").slice(-1)[0] : "—",
        desc: topArch
          ? `${topArch.name} jugado ${topArch.count} veces`
          : "Sin datos",
      },
      {
        icon: "📈",
        title: "Jugador más consistente",
        value: mostConsistent ? mostConsistent.name.split(" ")[0] : "—",
        desc: mostConsistent
          ? `Promedio puesto #${bestAvg.toFixed(1)} en ${mostConsistent.entries.length} torneos`
          : "Sin datos suficientes",
      },
      {
        icon: "🆕",
        title: `Nuevos en T${tournamentGroups.length}`,
        value: newPlayers.length || "—",
        desc:
          newPlayers.length > 0
            ? newPlayers.map((n) => n.split(" ")[0]).join(", ") +
              " se incorporaron en el último torneo"
            : "Sin jugadores nuevos en el último torneo",
      },
    ];

    const factsGrid = document.getElementById("factsGrid");
    factsGrid.innerHTML = "";

    facts.forEach((f) => {
      const card = document.createElement("div");
      card.className = "fact-card";
      card.setAttribute("data-icon", f.icon);
      card.innerHTML = `
        <div class="fact-title">${f.title}</div>
        <div class="fact-value">${f.value}</div>
        <div class="fact-desc">${f.desc}</div>
      `;
      factsGrid.appendChild(card);
    });
  }

  init();
</script>
